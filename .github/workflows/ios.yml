name: iOS

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: Тесты логики расписания
        run: |
          mkdir -p build
          swiftc -O -o build/coretests \
            Shared/Time.swift Shared/JSON.swift Shared/Schedule.swift Shared/Format.swift \
            Shared/Stats.swift Shared/Store.swift Tests/main.swift
          ./build/coretests Tests/schedule.json

      - name: Инструменты
        if: hashFiles('project.yml') != ''
        run: brew install xcodegen ldid

      - name: Сборка
        if: hashFiles('project.yml') != ''
        run: |
          VERSION_ARGS=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_ARGS="MARKETING_VERSION=${GITHUB_REF_NAME#v} CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}"
          fi
          xcodegen generate
          xcodebuild -project UniTime.xcodeproj -scheme UniTime -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            $VERSION_ARGS build > build/xcodebuild.log 2>&1 || {
              echo "::group::Ошибки компиляции"
              grep -E "error:" -A4 build/xcodebuild.log | head -300
              echo "::endgroup::"
              tail -60 build/xcodebuild.log
              exit 1
            }
          grep -E "warning:" build/xcodebuild.log | grep -v "/build/dd/" | sort -u | head -80 || true

      - name: Упаковка IPA
        if: hashFiles('project.yml') != ''
        run: |
          APP=build/dd/Build/Products/Release-iphoneos/UniTime.app
          # Подписываем «пустой» подписью с entitlements (App Group), чтобы iLoader/AltStore перенесли их в свою подпись.
          ldid -SWidgets/Widgets.entitlements "$APP/PlugIns/UniTimeWidgets.appex/UniTimeWidgets"
          ldid -SUniTime/UniTime.entitlements "$APP/UniTime"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../UniTime.ipa Payload)
          ls -lh build/UniTime.ipa

      - name: Артефакт
        if: hashFiles('project.yml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: UniTime-ipa
          path: build/UniTime.ipa
          retention-days: 30

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('project.yml') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: build/UniTime.ipa
          generate_release_notes: true
