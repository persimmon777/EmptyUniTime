name: iOS

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Выпустить релиз с этим тегом, например v1.1 (пусто — просто сборка)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      # Релиз: тег v*, ручной запуск с полем release или коммит с «[release vX.Y]» в сообщении.
      - name: Версия
        id: rel
        env:
          INPUT_RELEASE: ${{ github.event.inputs.release }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          REL=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then REL="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_RELEASE" ]]; then REL="$INPUT_RELEASE"
          elif [[ "$COMMIT_MSG" =~ \[release\ (v[0-9][0-9.]*)\] ]]; then REL="${BASH_REMATCH[1]}"
          fi
          echo "tag=$REL" >> "$GITHUB_OUTPUT"
          echo "Релиз: ${REL:-нет}"

      - name: Тесты логики расписания
        run: |
          mkdir -p build
          swiftc -O -o build/coretests \
            Shared/Time.swift Shared/JSON.swift Shared/Schedule.swift Shared/Format.swift \
            Shared/Stats.swift Shared/Store.swift Tests/main.swift
          ./build/coretests Tests/schedule.json

      - name: Инструменты
        if: hashFiles('project.yml') != ''
        run: brew install xcodegen ldid

      - name: Сборка
        if: hashFiles('project.yml') != ''
        run: |
          VERSION_ARGS=""
          REL="${{ steps.rel.outputs.tag }}"
          if [[ -n "$REL" ]]; then
            VERSION_ARGS="MARKETING_VERSION=${REL#v} CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}"
          fi
          xcodegen generate
          xcodebuild -project UniTime.xcodeproj -scheme UniTime -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            $VERSION_ARGS build > build/xcodebuild.log 2>&1 || {
              echo "::group::Ошибки компиляции"
              grep -E "error:" -A4 build/xcodebuild.log | head -300
              echo "::endgroup::"
              tail -60 build/xcodebuild.log
              exit 1
            }
          grep -E "warning:" build/xcodebuild.log | grep -v "/build/dd/" | sort -u | head -80 || true

      - name: Упаковка IPA
        if: hashFiles('project.yml') != ''
        run: |
          APP=build/dd/Build/Products/Release-iphoneos/UniTime.app
          # Подписываем «пустой» подписью с entitlements (App Group), чтобы iLoader/AltStore перенесли их в свою подпись.
          ldid -SWidgets/Widgets.entitlements "$APP/PlugIns/UniTimeWidgets.appex/UniTimeWidgets"
          ldid -SUniTime/UniTime.entitlements "$APP/UniTime"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../UniTime.ipa Payload)
          ls -lh build/UniTime.ipa

      - name: Артефакт
        if: hashFiles('project.yml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: UniTime-ipa
          path: build/UniTime.ipa
          retention-days: 30

      - name: Релиз
        if: steps.rel.outputs.tag != '' && hashFiles('project.yml') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: UniTime ${{ steps.rel.outputs.tag }}
          files: build/UniTime.ipa
          body_path: .github/release-notes.md

  screens:
    # Запуск в симуляторе: приложение стартует, не падает, и видно, как выглядят экраны.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Сборка для симулятора
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project UniTime.xcodeproj -scheme UniTime -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:" -A4 build.log | head -200; exit 1; }
      - name: Скриншоты
        run: |
          APP=build/sim/Build/Products/Debug-iphonesimulator/UniTime.app
          mkdir -p shots
          run_set() {
            DEV=$1; P=$2; shift 2
            echo "Симулятор $P: $DEV"
            xcrun simctl boot "$DEV" || true
            xcrun simctl bootstatus "$DEV" -b
            xcrun simctl status_bar "$DEV" override --time "10:30" --batteryLevel 100 --cellularBars 4 || true
            xcrun simctl install "$DEV" "$APP"
            for spec in "$@"; do
              name=${spec%%:*}; args=${spec#*:}
              xcrun simctl terminate "$DEV" com.unitime.ios 2>/dev/null || true
              xcrun simctl launch "$DEV" com.unitime.ios -screenshots YES $args
              sleep 9
              if xcrun simctl spawn "$DEV" launchctl list | grep -q com.unitime.ios; then echo "$P-$name: работает"; else echo "::error::$P-$name: приложение упало"; fi
              xcrun simctl io "$DEV" screenshot "shots/$P-$name.png"
            done
            xcrun simctl shutdown "$DEV" || true
          }
          G="-onboarded YES -group 572302 -subgroup 0"
          BIG=$(xcrun simctl list devices available | grep -m1 -E "iPhone 16 \(" | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          SE=$(xcrun simctl list devices available | grep -m1 -E "iPhone SE" | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          run_set "$BIG" a \
            "00-onboarding:" \
            "01-today:$G -startTab 0" \
            "02-feed:$G -startTab 1" \
            "03-deadlines:$G -startTab 2" \
            "04-profile:$G -startTab 3" \
            "05-search:$G -startTab 4" \
            "06-lesson:$G -openRoute lesson" \
            "07-settings:$G -openRoute settings" \
            "08-exams:$G -openRoute exams" \
            "09-subjects:$G -openRoute subjects" \
            "10-friends:$G -openRoute friends" \
            "11-editor:$G -openRoute editor" \
            "12-teacher:$G -openRoute teacher" \
            "13-today-dark:$G -startTab 0 -theme 3" \
            "14-feed-dark:$G -startTab 1 -theme 3" \
            "15-glass:$G -startTab 0 -style 1 -theme 1" \
            "16-color:$G -startTab 1 -style 2 -theme 3" \
            "17-neon:$G -startTab 0 -theme 4 -style 0"
          if [ -n "$SE" ]; then
            run_set "$SE" b \
              "01-today:$G -startTab 0 -theme 1 -style 0" \
              "02-feed:$G -startTab 1" \
              "06-lesson:$G -openRoute lesson" \
              "07-settings:$G -openRoute settings"
          fi
          ls shots
      - name: Скриншоты в лог
        run: |
          mkdir -p small
          for f in shots/*.png; do
            n=$(basename "$f" .png)
            sips -Z 560 -s format jpeg -s formatOptions 40 "$f" --out "small/$n.jpg" >/dev/null
            echo "SHOT $n $(base64 -i small/$n.jpg | tr -d '\n')"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: shots
          retention-days: 7
