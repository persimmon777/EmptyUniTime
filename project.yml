name: UniTime
options:
  bundleIdPrefix: com.unitime
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  UniTime:
    type: application
    platform: iOS
    sources:
      - UniTime
      - Shared
    dependencies:
      - target: UniTimeWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unitime.ios
        PRODUCT_NAME: UniTime
        CODE_SIGN_ENTITLEMENTS: UniTime/UniTime.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: UniTime/Info.plist
      properties:
        CFBundleDisplayName: UniTime
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.unitime.ios.refresh
        NSCalendarsFullAccessUsageDescription: UniTime добавляет пары в отдельный календарь «UniTime» и удаляет их оттуда по твоей команде.
        ITSAppUsesNonExemptEncryption: false
        UniTimeAppGroup: group.com.unitime.ios
        ALTAppGroups:
          - group.com.unitime.ios
  UniTimeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - path: Shared
        excludes:
          - Stats.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unitime.ios.widgets
        PRODUCT_NAME: UniTimeWidgets
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: UniTime
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UniTimeAppGroup: group.com.unitime.ios
        ALTAppGroups:
          - group.com.unitime.ios
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
